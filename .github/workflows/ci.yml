name: Backend checks
on:
  push:
    branches: [main, feature/comment-reaction-delete]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blacklight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run sync
      - run: npm test
      - run: npm run check
      - name: PostgreSQL reaction concurrency and rollback
        run: node --test tests/integration/comment-reaction-pg.test.mjs
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/blacklight_test
          HG_TEST_DATABASE_RESET: 'yes'
